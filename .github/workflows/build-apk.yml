name: Build & Release SolarQuote NG Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      # A debug build applies Capacitor's applicationIdSuffix ".debug", so the
      # app installs as com.solarquote.ng.debug and the artefact is literally
      # named app-debug.apk - which is the "app-debug" name reported from the
      # launcher. It is also unminified and unsigned, so it is both larger and
      # slower than it needs to be. Ship a real release build instead.
      - name: Generate Upload Keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fall back to a build-only password when the repository secrets are
          # not set, so a fork or a fresh clone still produces a working APK
          # rather than failing the whole release.
          STORE_PASS="${STORE_PASS:-solarquote-build}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair -v \
            -keystore android/app/solarquote-upload.jks \
            -alias solarquote \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=SolarQuote NG, OU=Engineering, O=SolarQuote NG, L=Lagos, C=NG"

      - name: Write Signing Config
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          STORE_PASS="${STORE_PASS:-solarquote-build}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          cat >> app/build.gradle <<'EOF'

          android {
            signingConfigs {
              release {
                if (project.hasProperty('storeFile')) {
                  storeFile file(project.property('storeFile'))
                  storePassword project.property('storePassword')
                  keyAlias project.property('keyAlias')
                  keyPassword project.property('keyPassword')
                }
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }
            }
          }
          EOF
          {
            echo "storeFile=solarquote-upload.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=solarquote"
            echo "keyPassword=$KEY_PASS"
          } >> gradle.properties

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarQuote-NG-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Main Branch Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: SolarQuote NG Release v0.2.1
          body: |
            ## SolarQuote NG v0.2.1 - sizing accuracy, catalog and UI fixes

            ### Fixed
            - **Facility presets sized the system to zero.** The four built-in
              templates referenced appliance keys that matched no catalog entry
              and carried no wattage, so the sizing engine saw an empty site. The
              app opened recommending the 1.5 kVA minimum for a school with 30
              fans and 40 lights. Presets now resolve to real products: a school
              template correctly yields 85 kWh/day and a 15 kVA array.
            - **Manufacturer tabs were empty for Appliances.** All 118 appliances
              are unbranded, so grouping by maker produced no tabs at all for the
              largest section in the catalog. Unbranded and single-maker sections
              now group by category, and tab counts still sum to the section size.
            - **Corrupted characters in the app and PDF.** Several source files
              had been re-encoded as CP1252, which mangled the Naira sign in
              user-facing text. Repaired and verified by codepoint.
            - **A corrupt saved-settings payload could white-screen the app.** A
              nested settings object is now only ever replaced by another object.
            - **Product cards were unreadable in places.** A redundant 8px brand
              badge at 3.27:1 contrast was removed, and the bottom navigation bar
              is now opaque so card gradients no longer bleed through the labels.

            ### New
            - **Parts and spares catalog** - 43 electrical parts (cable, MC4
              connectors, breakers, isolators, surge protection, racking, earth
              pits) in their own section, with New / Refurbished / Used grading.
              Parts are deliberately excluded from the load list, since a part has
              no wattage and would distort the sizing engine.
            - **Manufacturer grouping** - a tab bar per section so an installer
              browses Deye against Sunsynk rather than one long list, with real
              manufacturer artwork where it is available under a reusable licence.
            - **Visual audit harness** - drives the built app in a real browser
              and reports overflow, undersized touch targets, unlabeled controls,
              low-contrast text and missing alt text, per screen, in both themes
              and at 320px and 390px.

            ### Engineering
            - Embedded PDF font subset to only the glyphs used: 760 KB to 34 KB,
              shrinking the APK bundle materially.
            - Hardcoded product counts removed; the catalog total is now derived,
              with a test that fails if a stale number reappears.
            - ~330 automated assertions across billing, catalog, sizing,
              persistence, encoding, PDF output and a full jsdom render.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
